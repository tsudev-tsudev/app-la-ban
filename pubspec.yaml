# Pub workspace (Dart >= 3.6): một lần 'flutter pub get' ở gốc cho app + mọi package.
name: la_ban_workspace
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - app
  - packages/core
  - packages/design_system
  - packages/sensors
  - packages/compass_feature
  - packages/location_feature
  - packages/waypoint_feature
  - packages/map_feature
  - packages/ar_feature
  - packages/settings_feature
  - packages/security_sdk
  - packages/network
  - packages/storage
  - packages/i18n
  - packages/ads_iap
  - packages/test_kit
dev_dependencies:
  very_good_analysis: ^11.0.0
# SQLCipher (QUYET_DINH Q11): package:sqlite3 tải bản SQLCipher dựng sẵn (kiểm sha256) cho mọi nền tảng, kể cả test Linux.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
