# Worker la-ban-api. Cấp cao nhất = PRODUCTION (`npm run deploy`); `--env staging` = staging; `--env dev` = chỉ chạy máy.
# Tài nguyên tạo ở N2 (QUYET_DINH Q3); bảng D1 thêm từ S1 bằng migration BẤT BIẾN ở migrations/.
# Không workers.dev / preview URL: mọi lưu lượng phải qua tên miền proxied (SEC-EDGE EDG-01).
name = "la-ban-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Thu nhỏ gói (zod) + bỏ chú thích khỏi mã deploy.
minify = true
workers_dev = false
preview_urls = false
routes = [{ pattern = "compass-api.tsudev.com", custom_domain = true }]

[observability]
enabled = true

[vars]
MOI_TRUONG = "prod"
# Cloudflare List "la_ban_chan_ip" (tài khoản Free chỉ 1 List -> chỉ prod). Token: `wrangler secret put CF_LISTS_TOKEN`.
CF_ACCOUNT_ID = "9541f44e84433a32b013ec31bae14848"
CF_LIST_ID = "18b0a1e4506942969aad36e04ce95f46"
# S2 Play Integrity: gói + SHA-256 chứng chỉ khoá upload (R0, Q34 - Play App Signing dùng lại chính khoá này).
PI_GOI = "com.tsudev.laban"
PI_CHUNG_CHI = "cf09e7243bca9ab5d29dc788bbd31ba71efaebab7d69583d98bbfc5184a7f6bd"
# S6 Admin SOC: team Zero Trust + AUD ứng dụng Access "la-ban-admin" (tools/cloudflare/access.mjs in ra). AUD rỗng -> /admin 503.
ACCESS_TEAM = "purple-cake-8f2a.cloudflareaccess.com"
ACCESS_AUD = "f1dec48a71e9b10406ae9534bea272e055a6bcf58a302e8d9324286976641ed3"
SOC_NGUON = "https://compass-admin.tsudev.com"

[[d1_databases]]
binding = "DB"
database_name = "la-ban"
database_id = "cfca0a7f-203a-408b-a45b-bd76c636769f"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CAU_HINH"
id = "c3e4afcafd2241f0bd1c9c2edd2be09f"

[[r2_buckets]]
binding = "CDN"
bucket_name = "la-ban-cdn"

[[r2_buckets]]
binding = "NHAT_KY"
bucket_name = "la-ban-nhat-ky"

[[analytics_engine_datasets]]
binding = "SU_KIEN"
dataset = "la_ban_su_kien"

# Lớp giới hạn thô theo IP (SEC-API API-01). Rộng tay vì CGNAT ở VN (QUYET_DINH Q12); giới hạn chặt theo route ở DO GioiHanToc.
[[r2_buckets]]
binding = "BAN_DO"
bucket_name = "la-ban-cdn"

[[ratelimits]]
name = "RL_BAN_DO"
namespace_id = "1011"
simple = { limit = 3000, period = 60 }

[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

# Cron 5 phút: Threat Engine (hồi phục điểm, hạ trạng thái khi chặn hết hạn, đồng bộ Cloudflare List); lượt 19:15 UTC
# thêm dọn hạn lưu (Spec §6.4, DAT-01). Một lịch duy nhất / môi trường vì gói Free giới hạn số cron trigger toàn tài khoản.
[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "KHO_NONCE"
class_name = "KhoNonce"

[[durable_objects.bindings]]
name = "GIOI_HAN_TOC"
class_name = "GioiHanToc"

[[durable_objects.bindings]]
name = "PHONG_SOC"
class_name = "PhongSoc"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KhoNonce", "GioiHanToc", "PhongSoc"]

# ---------------------------------------------------------------- staging
[env.staging]
name = "la-ban-api-staging"
workers_dev = false
preview_urls = false
routes = [{ pattern = "compass-api-stg.tsudev.com", custom_domain = true }]

[env.staging.observability]
enabled = true

[env.staging.vars]
MOI_TRUONG = "staging"
# Staging nhận cả bản dev / stg (ký khoá debug -> không kiểm chứng chỉ).
PI_GOI = "com.tsudev.laban.stg,com.tsudev.laban.dev,com.tsudev.laban"
PI_CHUNG_CHI = ""
# SOC staging = Pages preview nhánh "staging" (binding API -> worker này). Service token e2e chỉ được nhận ở đây.
ACCESS_TEAM = "purple-cake-8f2a.cloudflareaccess.com"
ACCESS_AUD = "f1dec48a71e9b10406ae9534bea272e055a6bcf58a302e8d9324286976641ed3"
SOC_NGUON = "https://staging.la-ban-admin.pages.dev"
ACCESS_DICH_VU = "961951549f4f1b1786ccdfe3d53212bb.access"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "la-ban-staging"
database_id = "20ba2503-6007-4c7f-a390-43177c5310ce"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "CAU_HINH"
id = "9168f99dc8ab418fa1d5022b482b1cf6"

[[env.staging.r2_buckets]]
binding = "CDN"
bucket_name = "la-ban-cdn-staging"

[[env.staging.r2_buckets]]
binding = "NHAT_KY"
bucket_name = "la-ban-nhat-ky-staging"

[[env.staging.analytics_engine_datasets]]
binding = "SU_KIEN"
dataset = "la_ban_su_kien_staging"

[[env.staging.r2_buckets]]
binding = "BAN_DO"
bucket_name = "la-ban-cdn"

[[env.staging.ratelimits]]
name = "RL_BAN_DO"
namespace_id = "1012"
simple = { limit = 3000, period = 60 }

[[env.staging.ratelimits]]
name = "RL_IP"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[env.staging.triggers]
crons = ["*/5 * * * *"]

[[env.staging.durable_objects.bindings]]
name = "KHO_NONCE"
class_name = "KhoNonce"

[[env.staging.durable_objects.bindings]]
name = "GIOI_HAN_TOC"
class_name = "GioiHanToc"

[[env.staging.durable_objects.bindings]]
name = "PHONG_SOC"
class_name = "PhongSoc"

# ---------------------------------------------------------------- dev (chỉ `wrangler dev`, binding mô phỏng cục bộ)
[env.dev]
name = "la-ban-api-dev"
workers_dev = false

[env.dev.vars]
MOI_TRUONG = "dev"
PI_GOI = "com.tsudev.laban.dev,com.tsudev.laban.stg"
PI_CHUNG_CHI = ""

[[env.dev.d1_databases]]
binding = "DB"
database_name = "la-ban-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.dev.kv_namespaces]]
