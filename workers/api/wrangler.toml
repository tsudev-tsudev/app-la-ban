# Worker la-ban-api. Cấp cao nhất = PRODUCTION (`npm run deploy`); `--env staging` = staging; `--env dev` = chỉ chạy máy.
# Tài nguyên tạo ở N2 (QUYET_DINH Q3); bảng D1 thêm từ S1 bằng migration BẤT BIẾN ở migrations/.
# Không workers.dev / preview URL: mọi lưu lượng phải qua tên miền proxied (SEC-EDGE EDG-01).
name = "la-ban-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Thu nhỏ gói (zod) + bỏ chú thích khỏi mã deploy.
minify = true
workers_dev = false
preview_urls = false
routes = [{ pattern = "compass-api.tsudev.com", custom_domain = true }]

[observability]
enabled = true

[vars]
MOI_TRUONG = "prod"
# Cloudflare List "la_ban_chan_ip" (tài khoản Free chỉ 1 List -> chỉ prod). Token: `wrangler secret put CF_LISTS_TOKEN`.
CF_ACCOUNT_ID = "9541f44e84433a32b013ec31bae14848"
CF_LIST_ID = "18b0a1e4506942969aad36e04ce95f46"
# S2 Play Integrity: gói + SHA-256 chứng chỉ khoá upload (R0, Q34 - Play App Signing dùng lại chính khoá này).
PI_GOI = "com.tsudev.laban"
PI_CHUNG_CHI = "cf09e7243bca9ab5d29dc788bbd31ba71efaebab7d69583d98bbfc5184a7f6bd"
# S6 Admin SOC: team Zero Trust + AUD ứng dụng Access "la-ban-admin" (tools/cloudflare/access.mjs in ra). AUD rỗng -> /admin 503.
ACCESS_TEAM = "purple-cake-8f2a.cloudflareaccess.com"
ACCESS_AUD = "f1dec48a71e9b10406ae9534bea272e055a6bcf58a302e8d9324286976641ed3"
SOC_NGUON = "https://compass-admin.tsudev.com"
# S7c1 khiếu nại: hostname trang có widget Turnstile (bí mật: `wrangler secret put TURNSTILE_SECRET`).
TURNSTILE_TEN_MIEN = "compass.tsudev.com"
# M1a (Q55, SEC-IAP): chỉ bản do Play cài nhận quyền lợi; gói app Pro (Q56 - thêm vào PI_GOI ở M2); audience JWT OIDC của
# Pub/Sub push RTDN. Bí mật: `wrangler secret put KHOA_QUYEN_LOI` (base64 32 byte); RTDN_EMAIL đặt khi tạo Pub/Sub (runbook).
QL_YEU_CAU_PLAY = "1"
PI_GOI_PRO = "com.tsudev.laban.pro"
RTDN_AUD = "https://compass-api.tsudev.com/v1/play/rtdn"
# S11 (Q57): chặn route nghiệp vụ khi app báo Developer options / ADB bật. Kill-switch: đặt "0" + deploy (<= 30 s).
CHAN_DEV_MODE = "1"
AE_BANG = "la_ban_su_kien"
# Khoá CÔNG KHAI sao lưu D1 (S10a, RSA-OAEP 4096 SPKI) - khoá riêng ngoài repo, xem runbook sao-luu-khoi-phuc.md.
KHOA_SAO_LUU = ""

[[d1_databases]]
binding = "DB"
# Q53 (03/11/2026): primary ở SIN (cùng colo phục vụ người dùng VN). DB cũ `la-ban` (ICN) giữ để rollback tới 17/11.
database_name = "la-ban-prod"
database_id = "1730d7d5-2227-4e5e-b18c-d8dc470deed2"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CAU_HINH"
id = "c3e4afcafd2241f0bd1c9c2edd2be09f"

[[r2_buckets]]
binding = "CDN"
bucket_name = "la-ban-cdn"

[[r2_buckets]]
binding = "NHAT_KY"
bucket_name = "la-ban-nhat-ky"

[[analytics_engine_datasets]]
binding = "SU_KIEN"
dataset = "la_ban_su_kien"

# Lớp giới hạn thô theo IP (SEC-API API-01). Rộng tay vì CGNAT ở VN (QUYET_DINH Q12); giới hạn chặt theo route ở D1 (mw/gioi-han.ts, R3c).
[[r2_buckets]]
binding = "BAN_DO"
bucket_name = "la-ban-cdn"

[[ratelimits]]
name = "RL_BAN_DO"
namespace_id = "1011"
simple = { limit = 3000, period = 60 }

[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

# R3c (Q52): route công khai chỉ đọc (/v1/config, /v1/web/cau-hinh) - khoá "<route>:<ip>", không ghi D1.
[[ratelimits]]
name = "RL_DOC_CONG_KHAI"
namespace_id = "1021"
simple = { limit = 60, period = 60 }

# Cron 5 phút: Threat Engine (hồi phục điểm, hạ trạng thái khi chặn hết hạn, đồng bộ Cloudflare List); lượt 19:15 UTC
# thêm dọn hạn lưu (Spec §6.4, DAT-01). Một lịch duy nhất / môi trường vì gói Free giới hạn số cron trigger toàn tài khoản.
[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "PHONG_SOC"
class_name = "PhongSoc"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KhoNonce", "GioiHanToc", "PhongSoc"]

# R3c (Q52/Q54): nonce + gioi han theo route da chuyen sang D1 -> xoa hai lop DO (va du lieu cua chung).
[[migrations]]
tag = "v2"
deleted_classes = ["KhoNonce", "GioiHanToc"]

# ---------------------------------------------------------------- staging
[env.staging]
name = "la-ban-api-staging"
workers_dev = false
preview_urls = false
routes = [{ pattern = "compass-api-stg.tsudev.com", custom_domain = true }]

[env.staging.observability]
enabled = true

[env.staging.vars]
MOI_TRUONG = "staging"
# Staging nhận cả bản dev / stg (ký khoá debug -> không kiểm chứng chỉ).
PI_GOI = "com.tsudev.laban.stg,com.tsudev.laban.dev,com.tsudev.laban"
PI_CHUNG_CHI = ""
# SOC staging = Pages preview nhánh "staging" (binding API -> worker này). Service token e2e chỉ được nhận ở đây.
ACCESS_TEAM = "purple-cake-8f2a.cloudflareaccess.com"
ACCESS_AUD = "f1dec48a71e9b10406ae9534bea272e055a6bcf58a302e8d9324286976641ed3"
SOC_NGUON = "https://staging.la-ban-admin.pages.dev"
QL_YEU_CAU_PLAY = "0"
PI_GOI_PRO = "com.tsudev.laban.pro.stg,com.tsudev.laban.pro.dev,com.tsudev.laban.pro"
RTDN_AUD = "https://compass-api-stg.tsudev.com/v1/play/rtdn"
CHAN_DEV_MODE = "0"
# Staging dùng khoá thử của Cloudflare (luôn đạt, hostname example.com) -> không kiểm hostname.
TURNSTILE_TEN_MIEN = ""
ACCESS_DICH_VU = "961951549f4f1b1786ccdfe3d53212bb.access"
AE_BANG = "la_ban_su_kien_staging"
KHOA_SAO_LUU = ""

[[env.staging.d1_databases]]
binding = "DB"
database_name = "la-ban-staging"
database_id = "20ba2503-6007-4c7f-a390-43177c5310ce"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "CAU_HINH"
id = "9168f99dc8ab418fa1d5022b482b1cf6"

[[env.staging.r2_buckets]]
binding = "CDN"
bucket_name = "la-ban-cdn-staging"

[[env.staging.r2_buckets]]
binding = "NHAT_KY"
bucket_name = "la-ban-nhat-ky-staging"

[[env.staging.analytics_engine_datasets]]
binding = "SU_KIEN"
dataset = "la_ban_su_kien_staging"

[[env.staging.r2_buckets]]
binding = "BAN_DO"
bucket_name = "la-ban-cdn"

[[env.staging.ratelimits]]
name = "RL_BAN_DO"
namespace_id = "1012"
simple = { limit = 3000, period = 60 }

[[env.staging.ratelimits]]
name = "RL_IP"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

# R3c (Q52): route công khai chỉ đọc (/v1/config, /v1/web/cau-hinh) - khoá "<route>:<ip>", không ghi D1.
[[env.staging.ratelimits]]
name = "RL_DOC_CONG_KHAI"
namespace_id = "1022"
simple = { limit = 60, period = 60 }

[env.staging.triggers]
crons = ["*/5 * * * *"]

[[env.staging.durable_objects.bindings]]
name = "PHONG_SOC"
class_name = "PhongSoc"

