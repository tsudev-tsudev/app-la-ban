name: design_system
description: "Design tokens, theme, widget và icon dùng chung."
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  test_kit:

flutter:
  # Bản sao của design/fonts (Flutter chỉ đóng gói tài sản trong thư mục package) - cổng kiểm hai nơi trùng nhau.
  assets:
    - fonts/OFL.txt
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
